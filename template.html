<!doctype html><meta charset="utf-8">
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>FC온라인 내 전광판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
/* 야간 경기 전광판 — 무광 검정 보드, LED 앰버 숫자, 투광등 아래 피치. 간격은 도트 피치 4px 배수. */
:root {
  color-scheme: dark;
  --board: #0b0d0c; --panel: #151a17; --panel2: #1b211d; --line: #252d28; --line2: #333d37;
  --ink: #f4f1e8; --ink2: #cfccc1; --ink3: #a19e92;
  --amber: #ffb627; --amber-wash: rgba(255,182,39,.12);
  --win: #9be15d; --loss: #ff5a4e; --draw: #6b716c;
  --pitch: #163021; --pitchline: #2d5c43;
  --bronze: #c98a55; --silver: #bcc5cc; --gold: #e9c46a;
  --disp: "Do Hyeon", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --num: "Barlow Condensed", "Malgun Gothic", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: var(--board); scrollbar-color: var(--line2) var(--board); }
body { background: var(--board); color: var(--ink); font: 14px/1.5 var(--body); -webkit-text-size-adjust: 100%; caret-color: var(--amber); }
::selection { background: var(--amber); color: var(--board); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
a { color: var(--amber); text-underline-offset: 3px; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px 64px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* LED 숫자: 큰 숫자에만 도트 마스크 */
.led { font-family: var(--num); font-weight: 700; color: var(--amber); line-height: 1; font-variant-numeric: tabular-nums;
  -webkit-mask: radial-gradient(circle, #000 58%, transparent 63%) 0 0 / 4px 4px; mask: radial-gradient(circle, #000 58%, transparent 63%) 0 0 / 4px 4px; }
.num { font-family: var(--num); font-weight: 600; font-variant-numeric: tabular-nums; }
.relit { animation: relit .64s steps(8) var(--d, 0ms) both; }
@keyframes relit { 0% { opacity: .12; } 35% { opacity: 1; } 50% { opacity: .35; } 100% { opacity: 1; } }

/* 머리말 */
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 24px 0 16px; }
header.top h1 { font-family: var(--disp); font-weight: 400; font-size: 32px; line-height: 1.1; margin: 0 8px 0 0; letter-spacing: .01em; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line2); border-radius: 4px; padding: 4px 10px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
.chip b { color: var(--gold); font-weight: 700; }
.refresh { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.status { color: var(--ink3); font-size: 13px; text-align: right; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); background: var(--panel2); color: var(--ink); border-radius: 4px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 40px; }
.btn:hover { border-color: var(--ink3); }
.btn.amber { background: var(--amber); border-color: var(--amber); color: var(--board); }
.btn.amber:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn svg { width: 16px; height: 16px; flex: none; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.keyform { background: var(--panel); border: 1px solid var(--amber); border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
.keyform .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.keyform input { flex: 1 1 280px; min-width: 0; font: inherit; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line2); background: var(--board); color: var(--ink); min-height: 40px; }
.keyform p { margin: 8px 0 0; font-size: 13px; color: var(--ink3); }
.keyform .err { color: var(--loss); font-weight: 600; margin-top: 4px; }
.mock { background: var(--panel); border: 1px dashed var(--line2); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--ink2); margin-top: 16px; }

/* 가이드 줄: 지금 보는 범위 + 범위 바꾸기. 스크롤해도 고정 */
.guide { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 0; background: var(--board); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.guide .scope { font-size: 14px; color: var(--ink2); }
.guide .scope b { color: var(--ink); font-weight: 600; }
.guide .ctl { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
select { font: inherit; font-size: 14px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line2); border-radius: 4px; padding: 0 12px; min-height: 40px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line2); border-radius: 4px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--ink2); padding: 0 12px; min-height: 34px; border-radius: 3px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--board); font-weight: 700; }

/* 보드 공통 */
.board { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; min-width: 0; }
.bhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
.bh { font-family: var(--disp); font-weight: 400; font-size: 24px; line-height: 1.2; margin: 0; }
.bsub { font-size: 13px; color: var(--ink3); }
h3.mini { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 0 0 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.dot { border-radius: 50%; }
.sw.ring { border-radius: 50%; background: transparent !important; border: 2px solid; }
svg { display: block; }
.chart svg text { font-family: var(--num); font-size: 13px; fill: var(--ink3); font-variant-numeric: tabular-nums; }
.chart svg text.lbl { fill: var(--ink); font-weight: 600; }
.chart svg text.amb { fill: var(--amber); font-weight: 700; font-size: 16px; }
.empty { color: var(--ink3); font-size: 14px; padding: 24px 0; text-align: center; }

/* 1. 방금 경기 + 득점 순위 */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
@media (min-width: 1100px) { .hero { grid-template-columns: minmax(0, 600px) minmax(0, 1fr); } }
.when { font-size: 13px; color: var(--ink3); }
.score { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; margin: 16px 0 12px; }
.team { font-family: var(--disp); font-size: 24px; line-height: 1.15; overflow-wrap: anywhere; }
.team.opp { text-align: right; color: var(--ink2); }
.sc { font-size: 112px; letter-spacing: .02em; }
.resline { display: flex; justify-content: center; gap: 8px; align-items: center; font-size: 13px; color: var(--ink2); margin-top: -4px; }
.events { list-style: none; margin: 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.events li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14px; }
.events li.opp { color: var(--ink2); }
.events .m { font-family: var(--num); font-weight: 700; font-size: 18px; color: var(--amber); }
.events li.opp .m { color: var(--loss); }
.events small { color: var(--ink3); font-size: 13px; }
.form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 20px; }
.pips { display: flex; gap: 4px; }
.pip { width: 36px; height: 32px; border: 0; border-radius: 3px; display: grid; place-items: center; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; }
.pip.W { background: var(--win); color: var(--board); }
.pip.D { background: var(--draw); color: var(--ink); }
.pip.L { background: var(--loss); color: var(--board); }
.pip:hover { filter: brightness(1.12); }
.formsum { font-size: 13px; color: var(--ink2); }
.formsum b { color: var(--ink); }

table.lead { width: 100%; border-collapse: collapse; }
.lead th { font-size: 12px; color: var(--ink3); font-weight: 500; text-align: right; padding: 0 8px 8px; letter-spacing: .04em; white-space: nowrap; }
.lead th:nth-child(-n+2) { text-align: left; }
.lead td { padding: 8px; border-top: 1px solid var(--line); text-align: right; vertical-align: middle; }
.lead td.rk { font-family: var(--num); font-weight: 700; font-size: 20px; color: var(--ink3); text-align: left; width: 32px; }
.lead tr.sel td { background: var(--amber-wash); }
.lead .led { font-size: 32px; }
.lead .ap .led { font-size: 40px; }
.pbtn { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; min-width: 0; }
.pname { font-family: var(--disp); font-size: 19px; line-height: 1.2; }
.pname, .pd-name, .node .nn, .tl .who b { word-break: keep-all; overflow-wrap: anywhere; }
.team { word-break: keep-all; }
.pname .short { display: none; }
@media (max-width: 720px) { .lead .pname .full { display: none; } .lead .pname .short { display: inline; white-space: nowrap; } .lead .pname { display: block; } .lead .g { margin-left: 0; } .lead .pmeta { display: none; } .lead .face { width: 32px; height: 32px; } .lead td { padding: 8px 4px; } .pbtn { gap: 8px; } }
.pmeta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink3); margin-top: 2px; }
.badge { height: 16px; width: auto; display: inline-block; }
.g { display: inline-block; font-family: var(--num); font-size: 13px; font-weight: 700; border-radius: 3px; padding: 0 6px; line-height: 18px; color: var(--board); vertical-align: 2px; margin-left: 4px; background: var(--line2); }
.g.bronze { background: var(--bronze); } .g.silver { background: var(--silver); } .g.gold { background: var(--gold); }
.face { width: 40px; height: 40px; border-radius: 50%; background: var(--panel2); object-fit: cover; flex: none; border: 1px solid var(--line2); }
.face.sm { width: 28px; height: 28px; }
.face.xl { width: 88px; height: 88px; }
span.face { display: inline-flex; align-items: center; justify-content: center; font-family: var(--disp); color: var(--ink2); font-size: 16px; }
span.face.sm { font-size: 12px; } span.face.xl { font-size: 32px; }

/* 2. 스쿼드: 야간 피치 + 선택 선수 */
.squad { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 24px; }
@media (min-width: 1000px) { .squad { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } }
.formation { position: relative; aspect-ratio: 68 / 80; background: var(--pitch); border: 1px solid var(--pitchline); border-radius: 8px; overflow: hidden; }
.formation > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.fname { position: absolute; right: 16px; bottom: 12px; font-family: var(--num); font-weight: 700; font-size: 28px; color: var(--ink); opacity: .9; }
.node { position: absolute; transform: translate(-50%, -36%); width: 92px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 0; cursor: pointer; }
.node .face { width: 52px; height: 52px; border: 2px solid var(--board); }
.node .nn { font-family: var(--disp); font-size: 15px; line-height: 1.15; text-align: center; max-width: 92px; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
.node .rt { font-family: var(--num); font-weight: 700; font-size: 14px; line-height: 20px; padding: 0 8px; border-radius: 3px; background: var(--board); color: var(--ink); }
.node .rt.hot { color: var(--amber); }
.node:hover .face { border-color: var(--ink3); }
.node[aria-pressed="true"] .face { border-color: var(--amber); box-shadow: 0 0 0 2px var(--board), 0 0 0 4px var(--amber); }
.node[aria-pressed="true"] .rt { background: var(--amber); color: var(--board); }
@media (max-width: 560px) {
  .node { width: 72px; } .node .face { width: 40px; height: 40px; } .node .nn { font-size: 12px; max-width: 72px; } .node .rt { font-size: 12px; line-height: 18px; padding: 0 6px; }
  .fname { font-size: 22px; }
}

.pd-top { display: flex; align-items: center; gap: 16px; }
.pd-name { font-family: var(--disp); font-size: 32px; line-height: 1.15; }
.pd-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; color: var(--ink2); font-size: 14px; margin-top: 4px; }
.pd-meta > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pd-nav { margin-left: auto; display: flex; gap: 4px; align-self: flex-start; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line2); border-radius: 4px; cursor: pointer; padding: 0; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn:hover { border-color: var(--ink3); }
.pd-big { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pd-big > div { padding: 12px 0 12px 16px; border-left: 1px solid var(--line); }
.pd-big > div:first-child { border-left: 0; padding-left: 0; }
.pd-big .l { font-size: 13px; color: var(--ink2); }
.pd-big .led { font-size: 56px; display: block; margin: 4px 0; }
.pd-big .f { font-size: 12px; color: var(--ink3); }
.pd-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 640px) { .pd-cols { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }
.meter { display: grid; grid-template-columns: 80px minmax(0, 1fr) 48px; gap: 12px; align-items: center; font-size: 13px; padding: 4px 0; border-radius: 4px; }
.meter .k { color: var(--ink2); }
.meter .track { height: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter .fill { display: block; height: 100%; background: var(--amber); }
.meter .v { text-align: right; font-family: var(--num); font-weight: 700; font-size: 16px; }
.per { font-size: 13px; color: var(--ink2); margin-top: 8px; line-height: 1.8; }
.per b { color: var(--ink); font-family: var(--num); font-size: 15px; }
.combo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; }
.combo .k { color: var(--ink2); width: 64px; flex: none; }
.pchip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); background: var(--panel2); border-radius: 999px; padding: 2px 12px 2px 2px; cursor: pointer; min-height: 32px; }
.pchip:hover { border-color: var(--ink3); }
.pchip b { font-family: var(--num); color: var(--amber); font-size: 15px; }
.mini-pitch { max-width: 320px; }

/* 3. 전체 선수 표 */
.tbl-wrap { overflow-x: auto; margin: 0 -8px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl th { color: var(--ink3); font-weight: 500; font-size: 12px; }
.tbl th.l, .tbl td.l { text-align: left; }
.tbl td.n { font-family: var(--num); font-size: 17px; font-weight: 600; }
.tbl td.n.hi { color: var(--amber); font-weight: 700; }
.tbl tbody tr:hover td { background: var(--panel2); }
.tbl tr.sel td { background: var(--amber-wash); }
.tbl tr.few td { color: var(--ink3); }
.tbl .stick { position: sticky; left: 0; background: var(--panel); z-index: 1; }
.tbl tr.sel .stick { background: #262618; }
.sort { border: 0; background: none; color: inherit; font-size: 12px; padding: 4px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
th[aria-sort] .sort { color: var(--amber); font-weight: 700; }
.sort svg { width: 10px; height: 10px; }
.more { margin-top: 12px; }
@media (max-width: 720px) { .tbl .xs-hide { display: none; } }

/* 4. 팀 기록 */
.section { font-family: var(--disp); font-weight: 400; font-size: 28px; margin: 48px 0 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section small { font-family: var(--body); font-size: 14px; color: var(--ink3); }
.sboard { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line2); border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
.sboard > div { padding: 16px 8px 14px; text-align: center; background: var(--panel); min-width: 0; }
.sboard .led { font-size: 64px; display: block; }
.sboard .led.w { color: var(--win); } .sboard .led.l { color: var(--loss); } .sboard .led.d { color: var(--ink2); }
.sboard .k { display: block; font-size: 14px; color: var(--ink); margin-top: 6px; }
.sboard .f { display: block; font-size: 12px; color: var(--ink3); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 24px; }
@media (min-width: 960px) { .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .span2, .span-all { grid-column: 1 / -1; } .lead-chart { grid-column: 1 / -1; } }
@media (min-width: 1200px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .lead-chart { grid-column: span 2; grid-row: span 2; } }
.headnum { display: inline-flex; align-items: baseline; gap: 12px; } #trend-now, #shot-now { display: inline-flex; align-items: baseline; gap: 6px; } .headnum .led { font-size: 40px; } .headnum .k { font-size: 13px; color: var(--ink2); }
.pitch-wrap { display: grid; gap: 16px 24px; align-items: start; }
.lead-chart .pitch { max-width: 640px; }
@media (min-width: 700px) { .lead-chart .pitch-side { grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: start; } .lead-chart #shot-legend { flex-direction: column; } }
.pitch-side { display: grid; gap: 16px; align-content: start; }
.pitch { max-width: 600px; margin: 0 auto; width: 100%; }
.stats-mini { width: 100%; border-collapse: collapse; font-size: 14px; }
.stats-mini th, .stats-mini td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.stats-mini th:first-child, .stats-mini td:first-child { text-align: left; }
.stats-mini th { color: var(--ink3); font-weight: 500; font-size: 12px; }
.h2h { display: grid; grid-template-columns: 96px minmax(0, 1fr) 120px minmax(0, 1fr) 96px; align-items: center; gap: 16px; padding: 8px 0; border-top: 1px solid var(--line); }
.h2h.head { border-top: 0; padding-top: 0; }
.h2h .v { text-align: right; } .h2h .v.l { text-align: left; }
.h2h .v .led { font-size: 36px; } .h2h .v.w .led { color: var(--win); } .h2h .v.l .led { color: var(--loss); }
.h2h .nm { text-align: center; font-size: 14px; color: var(--ink); }
.h2h .bar { height: 12px; background: var(--line); display: flex; border-radius: 2px; overflow: hidden; }
.h2h .bar.lft { justify-content: flex-end; }
.h2h .bar i { display: block; height: 100%; }
.h2h .bar.lft i { background: var(--win); } .h2h .bar.rgt i { background: var(--loss); }
.h2h .bar.lo i { opacity: .4; }
.h2h .k { font-size: 13px; color: var(--ink2); }
@media (max-width: 720px) { .h2h { grid-template-columns: 52px minmax(0, 1fr) 76px minmax(0, 1fr) 52px; gap: 8px; } .h2h .v .led { font-size: 24px; } .h2h .nm { font-size: 12px; } }
.insight { margin: 0 0 12px; font-size: 14px; color: var(--ink); border-left: 1px solid var(--amber); padding-left: 12px; }

/* 경기 목록 */
.tbl td.scorers { text-align: left; max-width: 260px; overflow: hidden; text-overflow: ellipsis; color: var(--ink2); }
.tbl td.scorecell .led { font-size: 26px; }
.tbl .resm { display: none; } .oppm { display: none; font-size: 12px; color: var(--ink3); margin-left: 20px; }
.lead.wide .led { font-size: 28px; } .lead.wide .ap .led { font-size: 32px; }
.squad .formrow { grid-column: 1 / -1; }
.xbtn { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; cursor: pointer; font-variant-numeric: tabular-nums; }
.xbtn svg { width: 12px; height: 12px; color: var(--ink3); transition: transform .12s; }
tr.open .xbtn svg { transform: rotate(90deg); color: var(--amber); }
tr.open td { background: var(--amber-wash); }
.res { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.res i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.tag { font-size: 12px; color: var(--ink3); margin-left: 4px; }

  .oppm { display: block; }

}

<body>
<div class="wrap">
  <div id="app"></div>
  <footer>Data based on NEXON Open API · 넥슨 오픈 API는 매시 정각에 약 2시간 전 경기까지 반영돼요. 시간은 모두 한국 시간.</footer>
</div>
<div id="tip" role="tooltip"></div>
<script>
/*__COMPACT__*/
</script>
<script>
const DATA = __FCO_DATA__;

/* ---------- 공통 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => v != null && isFinite(v);
const f0 = v => num(v) ? String(Math.round(v)) : '–';
const f1 = v => num(v) ? v.toFixed(1) : '–';
const pct = (a, b) => b ? a / b * 100 : null;
const sum = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);
const avg = (a, f) => { const v = a.map(f).filter(num); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const RES = { W: '승', D: '무', L: '패' };
const RES_VAR = { W: 'var(--win)', D: 'var(--draw)', L: 'var(--loss)' };
const SHOT_TYPE = { 1: '일반 슛', 2: '감아차기', 3: '헤더', 4: '로빙슛', 5: '플레어슛', 6: '낮은 슛', 7: '발리', 8: '프리킥', 9: '페널티킥', 10: '무회전슛', 11: '바이시클킥', 12: '파워샷' };
const SHOT_RES = { 1: '유효슈팅', 2: '빗나감', 3: '골' };
const md = t => `${t.slice(5, 7)}.${t.slice(8, 10)} ${t.slice(11, 16)}`;
const mdShort = t => `${t.slice(5, 7)}.${t.slice(8, 10)}`;
const kstDate = utc => { if (!utc) return null; const ms = Date.parse(/[zZ]$/.test(utc) ? utc : utc + 'Z'); return isNaN(ms) ? null : new Date(ms + 9 * 3600e3).toISOString().slice(0, 10).replaceAll('-', '.'); };
const tipAttr = (s, focusable) => `data-tip="${esc(s)}"${focusable ? ' tabindex="0"' : ''}`;
const ICON = {
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
  chev: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>',
  prev: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>',
  next: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>',
  down: '<svg viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><path d="M1 3h8L5 8z"/></svg>',
  up: '<svg viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><path d="M1 7h8L5 2z"/></svg>',
};
function niceMax(v) {
  if (!(v > 0)) return 1;
  const e = 10 ** Math.floor(Math.log10(v));
  for (const m of [1, 2, 4, 6, 8, 10]) if (m * e >= v) return m * e;
  return 10 * e;
}
function barPath(x, y, w, h) { // 위쪽만 살짝 둥근 막대
  if (h <= 0) return '';
  const r = Math.min(2, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
// 선수 배열 pl[] 칸 번호 (compact.js 참고)
const P = { id: 0, pos: 1, rat: 2, g: 3, a: 4, sh: 5, grade: 6, sot: 7, pT: 8, pS: 9, dT: 10, dS: 11, tT: 12, tS: 13, ic: 14, aT: 15, aS: 16, bl: 17 };
const playerName = id => DATA.players[id]?.n || `선수 ${id}`;
const shortName = n => {
  let s = n.split(' ').pop();
  if (s.length > 6 && s.includes('-')) s = s.split('-').pop();
  return n.length <= 6 ? n : s;
};
const posName = p => p == 28 ? '교체' : (DATA.positions[p] || String(p));
const posGroup = p => p == 0 ? 'GK' : p <= 8 ? 'DF' : p <= 19 ? 'MF' : p <= 27 ? 'FW' : 'SUB';
const gradeClass = g => g >= 8 ? 'gold' : g >= 5 ? 'silver' : g >= 2 ? 'bronze' : '';
const gradeChip = g => g ? `<span class="g ${gradeClass(g)}" title="강화 ${g}단계">+${g}</span>` : '';
const classBadge = id => { const img = DATA.classes?.[Math.floor(id / 1e6)]; return img ? `<img class="badge" alt="" loading="lazy" src="${esc(img)}" onerror="this.remove()">` : ''; };
const led = (key, v, cls = '') => `<span class="led ${cls}" data-led="${esc(key)}">${v}</span>`;

/* ---------- 브라우저 저장 (새로고침으로 받은 경기 · API 키) ---------- */
const LSK = k => `fco:${DATA?.user?.nickname}:${k}`;
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }

const state = { mode: null, range: 50, shotSide: 'me', sortKey: 'ap', sortDir: 'desc', sel: null, playersAll: false, recentAll: false, openMatch: null, busy: false, status: '', keyForm: false, keyErr: '' };

function boot() {
  if (!DATA) { $('#app').innerHTML = '<div class="empty">데이터가 없어요. <code>node fetch.mjs</code> 또는 <code>node mock.mjs</code>로 만든 out/ 폴더의 HTML을 여세요.</div>'; return; }
  mergeExtra();
  const counts = modeCounts();
  state.mode = Number(Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0]) || null;
  document.title = `${DATA.user.nickname} · FC온라인 전광판`;
  renderShell();
  let rt, lastW = 0;
  new ResizeObserver(([e]) => {
    const w = Math.round(e.contentRect.width);
    if (w === lastW) return;
    lastW = w; clearTimeout(rt); rt = setTimeout(renderCharts, 80);
  }).observe($('#app'));
}
function mergeExtra() {
  const extra = lsGet(LSK('extra'));
  if (!extra) return;
  const known = new Set(DATA.matches.map(m => m.id));
  for (const m of extra.matches || []) if (!known.has(m.id)) { DATA.matches.push(m); known.add(m.id); }
  for (const [id, p] of Object.entries(extra.players || {})) if (!DATA.players[id]?.n) DATA.players[id] = p;
  if (extra.user) Object.assign(DATA.user, extra.user);
  if (extra.maxDivision) DATA.maxDivision = extra.maxDivision;
  if (extra.generatedAt && extra.generatedAt > DATA.generatedAt) DATA.generatedAt = extra.generatedAt;
  DATA.matches.sort((a, b) => a.t.localeCompare(b.t));
}
function modeCounts() {
  const c = {};
  for (const m of DATA.matches) if (DATA.matchTypes[m.mt]) c[m.mt] = (c[m.mt] || 0) + 1;
  return c;
}
function filtered() {
  const ms = DATA.matches.filter(m => m.mt === state.mode);
  return state.range ? ms.slice(-state.range) : ms;
}

/* ---------- 뼈대 ---------- */
function renderShell() {
  const counts = modeCounts();
  const u = DATA.user;
  const divs = DATA.maxDivision.filter(d => DATA.matchTypes[d.mt]).map(d => {
    const date = kstDate(d.date);
    return `<span class="chip" ${date ? `title="${date} 달성"` : ''}>${esc(DATA.matchTypes[d.mt])} 최고 <b>${esc(DATA.divisions?.[d.division] || d.name || d.division)}</b></span>`;
  }).join('');
  const modes = Object.keys(counts).map(Number).sort((a, b) => counts[b] - counts[a]);
  $('#app').innerHTML = `
    ${DATA.mock ? '<div class="mock">가상 데이터로 만든 미리보기예요. API 키를 넣고 <code>node fetch.mjs</code>를 실행하면 내 기록으로 바뀌어요.</div>' : ''}
    <header class="top">
      <h1>${esc(u.nickname)}</h1>
      ${u.level != null ? `<span class="chip">Lv.${esc(u.level)}</span>` : ''}${divs}
      <div class="refresh"><span class="status" id="rf-status" role="status"></span><button class="btn amber" id="rf" type="button">${ICON.refresh}새로고침</button></div>
    </header>
    <div id="keyslot"></div>
    <div class="guide" role="group" aria-label="보기 범위">
      <span class="scope" id="scope"></span>
      <span class="ctl">
        <label class="sr" for="mode">모드</label><select id="mode">${modes.map(t => `<option value="${t}">${esc(DATA.matchTypes[t])}</option>`).join('')}</select>
        <span class="seg" id="range" role="group" aria-label="경기 범위">${[[20, '최근 20'], [50, '최근 50'], [100, '최근 100'], [0, '전체']].map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${state.range === v}">${l}</button>`).join('')}</span>
      </span>
    </div>

    <div class="hero">
      <section class="board" id="last" aria-label="방금 경기"></section>
      <section class="board" aria-labelledby="lead-h"><div class="bhead"><h2 class="bh" id="lead-h">득점 순위</h2><span class="bsub" id="lead-sub">공격포인트 = 골 + 도움</span></div><div id="leaders"></div></section>
    </div>
    <div class="squad">
      <div class="formation" id="formation" aria-label="주전 포메이션"></div>
      <section class="board" id="pd" aria-label="선택한 선수"></section>
      <section class="board formrow" aria-labelledby="pf-h"><div class="bhead" style="margin-bottom:8px"><h3 class="bh" id="pf-h">평점 흐름</h3>
        <div class="legend"><span><i class="sw dot" style="background:var(--win)"></i>승</span><span><i class="sw dot" style="background:var(--draw)"></i>무</span><span><i class="sw dot" style="background:var(--loss)"></i>패</span></div></div>
        <div class="bsub" id="pf-sub" style="margin:-4px 0 8px"></div><div class="chart" id="pd-form"></div></section>
    </div>

    <h2 class="section">팀 기록<small id="team-sub"></small></h2>
    <section class="sboard" id="season" aria-label="팀 요약"></section>
    <div class="grid">
      <section class="board span-all"><div class="bhead"><span class="headnum"><h3 class="bh">승률 흐름</h3><span id="trend-now"></span></span>
        <div class="legend"><span><i class="sw" style="background:var(--win)"></i>승</span><span><i class="sw" style="background:var(--draw)"></i>무</span><span><i class="sw" style="background:var(--loss)"></i>패</span></div></div>
        <div class="bsub" id="trend-sub" style="margin:-8px 0 12px"></div><div class="chart" id="trend"></div></section>
      <section class="board lead-chart"><div class="bhead"><span class="headnum"><h3 class="bh">슈팅 맵</h3><span id="shot-now"></span></span>
        <span class="seg" id="shotside" role="group" aria-label="누구의 슈팅"><button type="button" data-v="me" aria-pressed="${state.shotSide === 'me'}">내 슈팅</button><button type="button" data-v="opp" aria-pressed="${state.shotSide === 'opp'}">상대 슈팅</button></span></div>
        <div class="bsub" id="shot-sub" style="margin:-8px 0 12px"></div>
        <div class="pitch-wrap"><div class="pitch chart" id="pitch"></div><div class="pitch-side"><div id="shot-legend" class="legend"></div><table class="stats-mini" id="boxstats"></table></div></div></section>
        <section class="board"><div class="bhead"><h3 class="bh">득점·실점 시간대</h3>
          <div class="legend"><span><i class="sw" style="background:var(--amber)"></i>득점</span><span><i class="sw" style="background:var(--loss)"></i>실점</span></div></div>
          <div class="bsub" id="gt-sub" style="margin:-8px 0 12px"></div><div class="chart" id="goaltime"></div></section>
        <section class="board"><div class="bhead"><h3 class="bh">시간대별 승률</h3></div>
          <div class="bsub" id="hr-sub" style="margin:-8px 0 12px"></div><div class="chart" id="hours"></div></section>
      <section class="board span-all"><div class="bhead"><h3 class="bh">이긴 경기 vs 진 경기</h3></div>
        <div id="compare"></div></section>
      <section class="board span-all" id="matches"><div class="bhead"><h3 class="bh">경기 기록</h3><span class="bsub">최신순 · 경기를 누르면 골 기록이 펼쳐져요</span></div>
        <div id="recent"></div></section>
    </div>`;

  $('#mode').value = state.mode;
  $('#mode').addEventListener('change', e => { state.mode = Number(e.target.value); state.playersAll = state.recentAll = false; state.openMatch = null; renderAll(); });
  segment('#range', v => { state.range = Number(v); renderAll(); });
  segment('#shotside', v => { state.shotSide = v; renderShots(filtered()); });
  $('#rf').addEventListener('click', refresh);
  renderRefreshUI();
  renderAll();
}
function segment(sel, on) {
  $(sel).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    for (const x of $(sel).querySelectorAll('button')) x.setAttribute('aria-pressed', x === b);
    on(b.dataset.v);
  });
}
function renderAll() {
  const ms = filtered();
  const first = ms[0], last = ms[ms.length - 1];
  $('#scope').innerHTML = ms.length
    ? `<b>${esc(DATA.matchTypes[state.mode] || '')}</b> · ${state.range && ms.length >= state.range ? `최근 ${ms.length}경기` : `${ms.length}경기 전부`} · ${mdShort(first.t)}–${mdShort(last.t)}`
    : `<b>${esc(DATA.matchTypes[state.mode] || '')}</b> · 경기 없음`;
  $('#team-sub').textContent = `${ms.length}경기`;
  renderLast(ms);
  renderSquad(ms);
  renderSeason(ms);
  renderCharts();
  renderRecent(ms);
}
function renderCharts() {
  const ms = filtered();
  renderPlayerCharts(ms);
  renderTrend(ms);
  renderShots(ms);
  renderGoalTime(ms);
  renderHours(ms);
  renderCompare(ms);
}

/* ---------- 1. 방금 경기 전광판 ---------- */
function goalEvents(m) {
  return [...m.shots.filter(s => s[3] === 3).map(s => ({ me: true, s })), ...m.oShots.filter(s => s[3] === 3).map(s => ({ me: false, s }))]
    .sort((a, b) => a.s[7] - b.s[7] || a.s[0] - b.s[0]);
}
function streakText(ms) {
  if (!ms.length) return '';
  const r = ms[ms.length - 1].res;
  let n = 0;
  for (let i = ms.length - 1; i >= 0 && ms[i].res === r; i--) n++;
  if (n < 2) return '';
  return r === 'W' ? `${n}연승 중` : r === 'L' ? `${n}연패 중` : `${n}경기 연속 무승부`;
}
function renderLast(ms) {
  const box = $('#last');
  if (!ms.length) { box.innerHTML = '<div class="empty">이 모드의 경기가 없어요.</div>'; return; }
  const m = ms[ms.length - 1];
  const ev = goalEvents(m).slice(0, 8);
  const recent = ms.slice(-10);
  const w = recent.filter(x => x.res === 'W').length, d = recent.filter(x => x.res === 'D').length, l = recent.length - w - d;
  const st = streakText(ms);
  box.innerHTML = `
    <div class="bhead" style="margin-bottom:0"><h2 class="bh">방금 경기</h2><span class="when">${md(m.t)}</span></div>
    <div class="score">
      <span class="team">${esc(DATA.user.nickname)}</span>
      <span class="sc led" data-led="last-score" aria-label="${m.gf} 대 ${m.ga ?? '알 수 없음'}">${m.gf}:${m.ga ?? '?'}</span>
      <span class="team opp">${esc(m.opp || '상대')}</span>
    </div>
    <div class="resline"><span class="res"><i style="background:${RES_VAR[m.res]}"></i>${RES[m.res]}</span>${m.so ? `· 승부차기 ${m.so[0]}:${m.so[1]}` : ''}${m.end === 1 ? ' · 몰수승' : m.end === 2 ? ' · 몰수패' : ''} · 점유율 ${f0(m.poss)}% · 슈팅 ${m.sh}</div>
    ${ev.length ? `<ul class="events">${ev.map(({ me, s }) => `<li class="${me ? '' : 'opp'}"><span class="m">${minLabel(s)}′</span><span>${esc(playerName(s[6]))}${me && s[8] ? ` <small>도움 ${esc(playerName(s[8]))}</small>` : ''}${me ? '' : ` <small>${esc(m.opp || '상대')}</small>`}</span></li>`).join('')}</ul>` : '<ul class="events"><li><span class="m">–</span><span class="bsub">골 없음</span></li></ul>'}
    <div class="form">
      <span class="bsub">최근 ${recent.length}경기</span>
      <span class="pips">${recent.map(x => `<button type="button" class="pip ${x.res}" data-mid="${esc(x.id)}" aria-label="${md(x.t)} ${esc(x.opp || '')} ${x.gf}:${x.ga ?? '?'} ${RES[x.res]}, 경기 기록 열기" ${tipAttr(`${md(x.t)}${x.opp ? ` vs ${x.opp}` : ''}\n${score(x)} ${RES[x.res]}`)}>${RES[x.res]}</button>`).join('')}</span>

  const shown = state.recentAll ? list : list.slice(0, 15);
  const rows = shown.map((m, i) => {
    const open = state.openMatch === m.id;
    const did = `md-${i}`;
    return `<tr class="${open ? 'open' : ''}" data-mid="${esc(m.id)}">
    <td class="l"><button type="button" class="xbtn" aria-expanded="${open}" ${open ? `aria-controls="${did}"` : ''}>${ICON.chev}<span class="num" style="font-size:15px">${md(m.t)}</span></button><span class="oppm">vs ${esc(m.opp || '알 수 없음')}</span></td>
    <td class="l xs-hide">${esc(m.opp || '알 수 없음')}</td>
    <td class="l xs-hide"><span class="res"><i style="background:${RES_VAR[m.res]}"></i>${RES[m.res]}</span>${m.end === 1 ? '<span class="tag">몰수승</span>' : m.end === 2 ? '<span class="tag">몰수패</span>' : ''}</td>
    <td class="n scorecell"><span class="resm res"><i style="background:${RES_VAR[m.res]}"></i>${RES[m.res]}</span>${led(`ml:${m.id}`, `${m.gf}:${m.ga ?? '?'}`)}${m.so ? `<span class="tag">PK ${m.so[0]}:${m.so[1]}</span>` : ''}</td><td class="scorers">${esc(scorers(m)) || '<span style="color:var(--ink3)">–</span>'}</td><td class="n xs-hide">${f0(m.poss)}%</td><td class="n xs-hide">${m.sh} (${m.sot})</td><td class="n xs-hide">${m.oSh ?? '–'} (${m.oSot ?? '–'})</td>
    <td class="n xs-hide">${m.rat ? m.rat.toFixed(2) : '–'}</td></tr>${open ? `<tr class="detail" id="${did}"><td colspan="9">${matchDetail(m)}</td></tr>` : ''}`;
  }).join('');
  $('#recent').innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">일시</th><th class="l xs-hide">상대</th><th class="l xs-hide">결과</th><th>스코어</th><th class="l">내 득점자</th><th class="xs-hide">점유율</th><th class="xs-hide">슈팅(유효)</th><th class="xs-hide">상대 슈팅(유효)</th><th class="xs-hide">팀 평점</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${list.length > 15 ? `<button class="btn more" id="rmore" type="button">${state.recentAll ? '접기' : `전체 ${list.length}경기 보기`}</button>` : ''}`;
  $('#recent').onclick = e => {
    if (e.target.closest('#rmore')) { state.recentAll = !state.recentAll; renderRecent(filtered()); return; }
    if (e.target.closest('tr.detail')) return;
    const tr = e.target.closest('tr[data-mid]'); if (!tr) return;
    const id = tr.dataset.mid;
    state.openMatch = state.openMatch === id ? null : id;
    renderRecent(filtered());
    document.querySelector(`tr[data-mid="${CSS.escape(id)}"] .xbtn`)?.focus({ preventScroll: true });
  };
}
function matchDetail(m) {
  const ev = goalEvents(m);
  let a = 0, b = 0;
  const items = ev.map(({ me, s }) => {
    me ? a++ : b++;
    const name = playerName(s[6]);
    return `<li class="${me ? '' : 'opp'}"><span class="min">${minLabel(s)}′</span><span class="sc2">${a}:${b}</span>
      <span class="who">${face(s[6], name, 'sm')}<span><b>${esc(name)}</b>${me ? '' : ` <span class="tag">${esc(m.opp || '상대')}</span>`}<br>
      <span class="ast">${s[8] ? `도움 ${esc(playerName(s[8]))} · ` : ''}${SHOT_TYPE[s[4]] || '슛'} · ${s[5] ? '박스 안' : '박스 밖'}</span></span></span></li>`;
  });
  const og = (n, me) => Array.from({ length: Math.max(0, n) }, () => `<li class="${me ? '' : 'opp'}"><span class="min">–</span><span class="sc2">·</span><span class="who">${me ? '상대 자책골' : '내 자책골'} <span class="ast">(시간 정보 없음)</span></span></li>`).join('');
  const extra = og(m.gf - a, true) + (m.ga != null ? og(m.ga - b, false) : '');
  const best = [...m.pl].filter(p => p[P.rat] > 0).sort((x, y) => y[P.rat] - x[P.rat])[0];
  const mine = m.shots.map(s => ({ s, m })), theirs = m.oShots.map(s => ({ s, m }));
  return `<div class="md">
    <div>
      <h4 class="mini" style="font-size:14px;margin:0 0 8px">골 기록 · ${esc(score(m))} ${RES[m.res]}</h4>
      ${items.length || extra ? `<ul class="tl">${items.join('')}${extra}</ul>` : '<div class="empty" style="padding:12px 0">골 없음</div>'}
      <div class="md-facts">
        ${best ? `<span>이 경기 최고 평점 <b>${esc(playerName(best[P.id]))} ${best[P.rat].toFixed(1)}</b></span>` : ''}
        <span>점유율 <b>${f0(m.poss)}%</b></span><span>패스 <b>${m.pT ? f0(m.pS / m.pT * 100) + '%' : '–'}</b></span>
      </div>
    </div>
    <div class="md-pitches">
      <div><div class="cap">내 슈팅 ${mine.length}개</div>${mine.length ? pitchSVG(mine, 'var(--amber)', true, true) : '<div class="empty">없음</div>'}</div>
      <div><div class="cap">상대 슈팅 ${theirs.length}개</div>${theirs.length ? pitchSVG(theirs, 'var(--loss)', true, true) : '<div class="empty">없음</div>'}</div>
    </div>
  </div>`;
}

/* ---------- 새로고침: 브라우저에서 넥슨 API를 직접 불러 새 경기만 추가 ---------- */
const KEY_LS = 'fco:apikey';
const API = 'https://open.api.nexon.com';
const ERR = { OPENAPI00004: '닉네임이나 요청 값이 올바르지 않아요', OPENAPI00005: 'API 키가 올바르지 않아요. 키를 다시 넣어 주세요', OPENAPI00007: '호출 한도를 넘었어요. 잠시 뒤 다시 눌러 주세요', OPENAPI00010: '게임 점검 중이에요. 점검이 끝나면 다시 눌러 주세요', OPENAPI00011: 'API 점검 중이에요. 잠시 뒤 다시 눌러 주세요' };
let lastCall = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function napi(path, params = {}, key) {
  const u = new URL(path, API);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  for (let attempt = 0; attempt < 4; attempt++) {
    const wait = lastCall + 230 - Date.now(); if (wait > 0) await sleep(wait); // 초당 5회 미만
    lastCall = Date.now();
    const r = await fetch(u, { headers: key ? { 'x-nxopen-api-key': key } : {} });
    if (r.ok) return r.json();
    const body = await r.json().catch(() => ({}));
    const code = body?.error?.name;
    if ((r.status === 429 || code === 'OPENAPI00007') && attempt < 3) { await sleep(1500 * (attempt + 1)); continue; }
    if (code === 'OPENAPI00009') return null;
    const e = new Error(ERR[code] || `요청이 실패했어요 (${r.status}${code ? ' ' + code : ''})`); e.code = code; throw e;
  }
}
function renderRefreshUI() {
  const btn = $('#rf');
  btn.disabled = state.busy;
  btn.classList.toggle('spin', state.busy);
  $('#rf-status').textContent = state.status || (() => {
    const g = new Date(DATA.generatedAt);
    return isNaN(g) ? '' : `업데이트 ${g.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`;
  })();
  $('#keyslot').innerHTML = state.keyForm ? `<form class="keyform" id="keyform">
      <label for="keyin"><b>넥슨 오픈 API 키</b></label>
      ${state.keyErr ? `<div class="err" role="alert">${esc(state.keyErr)}</div>` : ''}
      <div class="row"><input id="keyin" type="password" autocomplete="off" placeholder="openapi.nexon.com 에서 받은 키 붙여넣기">
        <button class="btn amber" type="submit">저장하고 새로고침</button><button class="btn" type="button" id="keycancel">취소</button></div>
      <p>키는 이 기기의 이 브라우저에만 저장되고 파일이나 링크에는 들어가지 않아요. 한 번만 넣으면 돼요.</p></form>` : '';
  if (state.keyForm) {
    $('#keyin').focus();
    $('#keyform').addEventListener('submit', e => {
      e.preventDefault();
      const v = $('#keyin').value.trim(); if (!v) return;
      if (!lsSet(KEY_LS, v)) window.__fcoKey = v;
      state.keyForm = false; state.keyErr = '';
      refresh();
    });
    $('#keycancel').addEventListener('click', () => { state.keyForm = false; state.keyErr = ''; renderRefreshUI(); $('#rf').focus(); });
  }
}
function snapshotLED() { return new Map([...document.querySelectorAll('[data-led]')].map(el => [el.dataset.led, el.textContent])); }
function relight(prev) { // 바뀐 숫자만 제자리에서 차례로 다시 켠다
  let i = 0;
  for (const el of document.querySelectorAll('[data-led]')) {
    if (prev.has(el.dataset.led) && prev.get(el.dataset.led) === el.textContent) continue;
    el.style.setProperty('--d', `${Math.min(i++, 16) * 70}ms`);
    el.classList.add('relit');
  }
}
async function refresh() {
  if (state.busy) return;
  const key = lsGet(KEY_LS) || window.__fcoKey;
  if (!key) { state.keyForm = true; renderRefreshUI(); return; }
  const setStatus = s => { state.status = s; renderRefreshUI(); };
  state.busy = true; setStatus('계정 확인 중…');
  const added = [], newPlayers = {};
  try {
    const nick = DATA.user.nickname;
    const { ouid } = await napi('/fconline/v1/id', { nickname: nick }, key);
    const basic = await napi('/fconline/v1/user/basic', { ouid }, key);
    const maxd = await napi('/fconline/v1/user/maxdivision', { ouid }, key);
    if (basic) DATA.user.level = basic.level;
    if (Array.isArray(maxd)) DATA.maxDivision = maxd.map(m => ({ mt: m.matchType, division: m.division, date: m.achievementDate }));
    const known = new Set(DATA.matches.map(m => m.id)), fresh = [];
    for (const mt of Object.keys(DATA.matchTypes)) {
      setStatus(`${DATA.matchTypes[mt]} 목록 확인 중…`);
      const list = (await napi('/fconline/v1/user/match', { ouid, matchtype: mt, offset: 0, limit: 100 }, key)) || [];
      for (const x of list) { const id = typeof x === 'string' ? x : x?.matchId; if (id && !known.has(id)) { fresh.push(id); known.add(id); } }
    }
    const todo = fresh.slice(0, 200);
    for (let i = 0; i < todo.length; i++) {
      setStatus(`새 경기 받는 중 ${i + 1}/${todo.length}`);
      const c = compactMatch(await napi('/fconline/v1/match-detail', { matchid: todo[i] }, key), [ouid], nick);
      if (c) added.push(c);
    }
    const unknown = new Set();
    for (const m of added) {
      for (const p of m.pl) if (!DATA.players[p[0]]?.n) unknown.add(p[0]);
      for (const s of [...m.shots, ...m.oShots]) for (const id of [s[6], s[8]]) if (id && !DATA.players[id]?.n) unknown.add(id);
    }
    if (unknown.size) {
      setStatus('새 선수 이름 받는 중…');
      const [sp, cl] = await Promise.all([napi('/static/fconline/meta/spid.json'), napi('/static/fconline/meta/class.json').catch(() => [])]);
      const nm = new Map((sp || []).map(s => [s.id, s.name])), cn = new Map((cl || []).map(c => [c.class, c]));
      for (const id of unknown) {
        const c = cn.get(Math.floor(id / 1e6));
        newPlayers[id] = DATA.players[id] = { n: nm.get(id) || null, c: c?.className || null };
        if (c?.classImg) (DATA.classes ||= {})[c.class] = c.classImg;
      }
    }
    const prevLED = snapshotLED();
    DATA.matches.push(...added);
    DATA.matches.sort((a, b) => a.t.localeCompare(b.t));
    DATA.generatedAt = new Date().toISOString();
    const prev = lsGet(LSK('extra')) || { matches: [], players: {} };
    const saved = lsSet(LSK('extra'), {
      matches: [...prev.matches, ...added].slice(-600), players: { ...prev.players, ...newPlayers },
      user: DATA.user, maxDivision: DATA.maxDivision, generatedAt: DATA.generatedAt,
    });
    state.busy = false;
    state.status = (added.length ? `새 경기 ${added.length}개 추가됨` : '새 경기 없음 · 넥슨은 약 2시간 늦게 반영돼요') + (saved ? '' : ' (이 브라우저는 저장이 막혀 있어 창을 닫으면 사라져요)');
    if (!DATA.matchTypes[state.mode]) state.mode = Number(Object.keys(DATA.matchTypes)[0]);
    renderShell();
    if (added.length && !matchMedia('(prefers-reduced-motion: reduce)').matches) relight(prevLED);
    $('#rf').focus();
  } catch (e) {
    state.busy = false;
    if (e.code === 'OPENAPI00005') { lsDel(KEY_LS); window.__fcoKey = null; state.keyForm = true; state.keyErr = e.message; state.status = ''; }
    else if (e instanceof TypeError) state.status = '넥슨 서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요';
    else state.status = `${e.message}${added.length ? ` (받은 ${added.length}경기는 반영 안 됨)` : ''}`;
    renderRefreshUI();
  }
}

/* ---------- 툴팁: 마우스, 키보드 포커스, 터치 모두 ---------- */
const tip = $('#tip');
function placeTip(x, y) {
  const pad = 14, r = tip.getBoundingClientRect();
  let tx = x + pad, ty = y + pad;
  if (tx + r.width > innerWidth - 8) tx = x - r.width - pad;
  if (ty + r.height > innerHeight - 8) ty = y - r.height - pad;
  tip.style.left = Math.max(8, tx) + 'px'; tip.style.top = Math.max(8, ty) + 'px';
}
function showTip(e, text) { tip.textContent = text; tip.classList.add('on'); placeTip(e.clientX, e.clientY); }
function showTipAt(el) {
  tip.textContent = el.getAttribute('data-tip'); tip.classList.add('on');
  const r = el.getBoundingClientRect();
  placeTip(r.left + r.width / 2, r.top + r.height / 2);
}
function hideTip() { tip.classList.remove('on'); }
document.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const t = e.target.closest?.('[data-tip]');
  if (t) showTip(e, t.getAttribute('data-tip'));
  else if (!e.target.closest?.('#tr-hit')) hideTip();
});
document.addEventListener('pointerup', e => {
  if (e.pointerType !== 'touch') return;
  const t = e.target.closest?.('[data-tip]');
  if (t && !t.closest('button')) showTipAt(t);
  else if (!e.target.closest?.('#tr-hit')) hideTip();
});
document.addEventListener('focusin', e => { const t = e.target.closest?.('[data-tip]'); if (t && e.target.matches(':focus-visible')) showTipAt(t); });
document.addEventListener('focusout', hideTip);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', () => { if (tip.classList.contains('on')) hideTip(); }, { passive: true });

boot(); // 모든 선언이 끝난 뒤 시작
</script>
</body>
